# 已切换至阿里云 ESA Pages；本 workflow 默认不再随 push 自动部署。
# 如需临时回退 GitHub Pages，可手动 Run workflow，并在仓库 Settings → Pages 重新启用。
name: Deploy static site (figma-ui)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: figma-ui
        env:
          # 普通仓库：/<仓库名>/ ；用户主页仓库 <user>.github.io 时用 /
          VITE_BASE_URL: ${{ github.event.repository.name == format('{0}.github.io', github.event.repository.owner.login) && '/' || format('/{0}/', github.event.repository.name) }}
        run: |
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: figma-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
